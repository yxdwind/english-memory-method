name: Publish to npm

# Trusted Publishing（OIDC）：零 token 发布，不受 npm 2026-08/2027-01 收紧 bypass token 的影响。
#
# 首次启用（一次性手工操作，见 readme「快速开始」与 docs/）：
#   1. 本地 `npm login` 后 `npm publish` 完成首次发布，注册包名；
#   2. npmjs.com → 包页面 → Settings → Trusted Publisher：
#      关联本仓库（yxdwind/english-memory-method）+ 本工作流文件名（publish.yml）；
#   3. 之后每次 `git tag v2.28.3 && git push origin v2.28.3` 即自动发布。
#
# 前置要求：npm CLI ≥ 11.5 才支持 OIDC 换取发布凭据（下面显式装最新 npm）。

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # OIDC → npm trusted publishing（唯一需要的权限）
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - name: Tag 版本必须与 package.json 一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG ≠ package.json v$PKG —— 先升版本再打 tag"; exit 1
          fi

      - name: 质量门（版本一致性 + 全量测试）
        run: |
          npm install -g npm@latest
          npm run version-check
          npm test
          npm run verify:fixture

      - name: Publish（OIDC，无 token）
        run: npm publish --provenance
