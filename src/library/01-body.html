<div class="wrap">
<!-- ① 头部与书架容器（无需改动，数字由组件运行时计算） -->
<header>

  <p class="lib-sub"></p>

  <p>先用背诵法生成第一篇方案（<b>&lt;topic&gt;-memorization-plan.html</b>），</p>
  <p>然后对 AI 说「<b>更新记忆库</b>」，它会把所有方案汇进这里。</p>
</div>

<div class="lib-session" id="emm-lib-session" hidden></div>

<footer>English teacher · 个人记忆库 · 进度实时读取自本机浏览器 · 打卡与薄弱清单以原方案为准</footer>
